{% extends "base.html" %}

{% block content %}

<div class="auth-container">
    <div class="auth-card">
        <h2>Reset Password</h2>

        <form method="POST">
            <input
                type="password"
                name="password"
                placeholder="Enter New Password"
                required
            >

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm Password"
                required
            >

            <button type="submit">
                Reset Password
            </button>
        </form>
    </div>
</div>

{% endblock %}
